<header [class.scrolled]="isScrolled()" class="site-header">
    <div class="header-container">
        <!-- Logo -->
        <a (click)="navigateTo('home')" class="brand-logo">
            <i class="fa-solid fa-gopuram logo-icon"></i>
            <div class="brand-text">
                <span class="company-name">{{ templeData.companyName }}</span>
                <span class="company-subtext">आपकी आस्था, हमारा उत्कृष्ट निर्माण</span>
            </div>
        </a>

        <!-- Desktop Navigation -->
        <nav class="desktop-nav">
            <a (click)="navigateTo('home')">होम</a>
            <a (click)="navigateTo('about')">हमारे बारे में</a>
            <a (click)="navigateTo('founder')">संस्थापक</a>
            <a (click)="navigateTo('services')">सेवाएं</a>
            <a (click)="navigateTo('gallery')">गैलरी</a>
            <a (click)="navigateTo('testimonials')">प्रतिक्रियाएं</a>
            <a (click)="navigateTo('location')">स्थान</a>
            <a (click)="navigateTo('contact')">संपर्क</a>
        </nav>

        <!-- CTA Action -->
        <div class="header-actions">
            <button (click)="openEnquiry()" class="btn-enquire">
                <i class="fa-solid fa-om"></i> पूछताछ करें
            </button>

            <button (click)="toggleMobileMenu()" class="mobile-toggle" [attr.aria-expanded]="isMobileOpen()">
                <i [class]="isMobileOpen() ? 'fa-solid fa-xmark' : 'fa-solid fa-bars-staggered'"></i>
            </button>
        </div>
    </div>

    <!-- Mobile Dropdown -->
    <div class="mobile-menu" [class.open]="isMobileOpen()">
        <nav>
            <a (click)="navigateTo('home')"><i class="fa-solid fa-house"></i> होम</a>
            <a (click)="navigateTo('about')"><i class="fa-solid fa-landmark"></i> हमारे बारे में</a>
            <a (click)="navigateTo('founder')"><i class="fa-solid fa-user-tie"></i> संस्थापक</a>
            <a (click)="navigateTo('services')"><i class="fa-solid fa-hammer"></i> सेवाएं</a>
            <a (click)="navigateTo('gallery')"><i class="fa-solid fa-images"></i> गैलरी</a>
            <a (click)="navigateTo('testimonials')"><i class="fa-solid fa-comment-dots"></i> प्रतिक्रियाएं</a>
            <a (click)="navigateTo('location')"><i class="fa-solid fa-location-dot"></i> स्थान</a>
            <a (click)="navigateTo('contact')"><i class="fa-solid fa-phone"></i> संपर्क करें</a>
            <button (click)="openEnquiry(); toggleMobileMenu()" class="mobile-cta-btn">
                पूछताछ करें
            </button>
        </nav>
    </div>
</header>
